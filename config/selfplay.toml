# selfplay: settings for the engine self-play games (Part II).
#
# Each engine plays itself from every starting position, using that
# position's lines from the opening book. Every line is played
# `games_per_line` times, half with each copy of the engine as White, so each
# position gets lines_per_position x games_per_line games (50 x 10 = 500).
# Games are run with fastchess (tools/fastchess/build_linux.sh), one fastchess
# match per position.

[output]
# Relative to the repository root.
dir = "results/selfplay"

[book]
# The book written by `opening_book_generator.py collect`. Its lines are
# matched to games by round number and checked against the book moves.
lines = "results/opening_book/book/opening_book_lines.parquet"

[match]
engines = ["stockfish", "caissa"]   # folder names under engines/; pick one with --engine
tc = "10+0.1"                       # seconds + increment per move
games_per_line = 10                 # must be even (colours are swapped in pairs)
# fastchess binary, relative to the repository root.
fastchess = "tools/fastchess/bin/fastchess"
# Draw adjudication: from move `movenumber`, a game is a draw once both
# engines' scores have been within `score` cp of 0 for `movecount` moves in a row.
draw = { movenumber = 40, movecount = 8, score = 10 }
# Resignation: a game ends once both engines agree on a score beyond `score` cp
# for `movecount` moves in a row.
resign = { movecount = 5, score = 1000, twosided = true }
# Hard cap on game length in moves (a draw if reached); 0 = none.
maxmoves = 0
# Syzygy tablebases for adjudicating endgames, as a path (several separated
# by ':'), or "" for none. `tbpieces` caps the number of pieces probed.
tablebases = ""
tbpieces = 5

[uci_overrides]
# Applied on top of each engine's engine.toml options for self-play only.
# One thread per engine; a small hash suits 10+0.1 (Fishtest uses 16 MB at
# this time control) and keeps memory low with many concurrent games.
Threads = 1
Hash = 64
