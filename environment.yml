# Conda environment for the Chess960 fairness project.
#   conda env create -f environment.yml
#   conda activate chess960
# After changing dependencies: conda env update -f environment.yml --prune
# Keep the versions here in step with pyproject.toml.
#
# If conda is killed while "collecting package metadata" (common on cluster
# login nodes with per-user memory limits), create just Python and pip-install
# the rest instead:
#   conda create -n chess960 python=3.12 -y
#   conda activate chess960
#   pip install chess numpy pandas pyarrow scipy pytest matplotlib cairosvg
name: chess960
channels:
  - conda-forge
  - nodefaults   # don't also load Anaconda's default channels (saves memory)
dependencies:
  - python=3.12
  - numpy>=1.26
  - pandas>=2.2
  - pyarrow>=15
  - scipy>=1.11   # analysis (code/analyse_sp.py)
  - pytest>=8
  # Figures (code/plot_boards.py, code/analyse_sp.py). conda-forge's cairosvg brings the cairo
  # library with it, including on Windows.
  - matplotlib>=3.8
  - cairosvg>=2.7
  - pip
  - pip:
      # python-chess is published on PyPI as "chess"
      - chess>=1.11
