[project]
name = "chess960-fairness"
version = "0.1.0"
description = "Quantitative evaluation of fairness across the 960 Chess960 starting positions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
# Figures (code/plot_boards.py); cairosvg needs the cairo library installed.
figures = ["matplotlib>=3.8", "cairosvg>=2.7"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# The code/ folder holds scripts, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
